# ==============================================================================
# Wasl AI - Render Blueprint Deployment Specification (render.yaml)
# ==============================================================================
# Free-Tier Architecture:
#   1. wasl-ai-backend  (Render Web Service: FastAPI + Gunicorn ASGI, free tier)
#   2. wasl-ai-frontend (Render Static Site: React + Vite SPA, free tier)
#   Database is hosted on Supabase PostgreSQL (free tier, external).
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Backend Web Service (FastAPI REST API)
  # ----------------------------------------------------------------------------
  - type: web
    name: wasl-ai-backend
    runtime: python
    region: frankfurt # Or oregon / ohio depending on Supabase region
    plan: free
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: gunicorn -k uvicorn.workers.UvicornWorker -c gunicorn_conf.py app.main:app
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: PROJECT_NAME
        value: "Wasl AI"
      - key: API_V1_STR
        value: /api/v1
      - key: LOG_LEVEL
        value: INFO
      - key: ENABLE_API_DOCS
        value: "false"
      - key: SECRET_KEY
        generateValue: true # Render will automatically generate a cryptographically secure 256-bit key
      - key: DATABASE_URL
        sync: false # Set in Render Dashboard: Supabase connection URI (postgresql+psycopg2://...)
      - key: GEMINI_API_KEY
        sync: false # Set in Render Dashboard: Google AI Studio Gemini API Key
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
      - key: CORS_ALLOWED_ORIGINS
        sync: false # Set in Render Dashboard to your frontend URL, e.g. https://wasl-ai-frontend.onrender.com
      - key: ALLOWED_HOSTS
        value: "*" # Or specific Render hostnames

  # ----------------------------------------------------------------------------
  # 2. Frontend Static Site (React + Vite SPA)
  # ----------------------------------------------------------------------------
  - type: static_site
    name: wasl-ai-frontend
    region: frankfurt
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false # Set to https://wasl-ai-backend.onrender.com (the URL of your backend web service)
